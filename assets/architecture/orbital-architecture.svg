<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura conceitual do Supercomputador Quântico Orbital</title>
  <desc id="desc">Diagrama conceitual com segmento orbital, payload quântico e armazenamento óptico 5D, serviços de inteligência artificial e segmento de solo. As interfaces não estão implementadas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07152b"/><stop offset="1" stop-color="#102d4d"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#37d6c0"/><stop offset="1" stop-color="#62a8ff"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#75d9e6"/></marker>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#eaf4ff}.muted{fill:#a9bed4}.title{font-size:38px;font-weight:700}.subtitle{font-size:19px}.head{font-size:23px;font-weight:700}.body{font-size:17px}.small{font-size:14px}.card{fill:#102b49;stroke:#3c6488;stroke-width:2}.orbit{fill:none;stroke:#3677a2;stroke-width:2;stroke-dasharray:10 10}.link{fill:none;stroke:#75d9e6;stroke-width:3;marker-end:url(#arrow)}.dashed{stroke-dasharray:9 8}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1330" cy="155" r="100" fill="#173d63" opacity=".45"/><circle cx="1330" cy="155" r="62" fill="#f0b45b" opacity=".9"/>
  <text x="80" y="83" class="title">Supercomputador Quântico Orbital (SQO)</text>
  <text x="82" y="120" class="subtitle muted">Visão de arquitetura conceitual • sem hardware ou integrações operacionais declaradas</text>
  <ellipse cx="810" cy="425" rx="590" ry="230" class="orbit" transform="rotate(-12 810 425)"/>
  <g transform="translate(655 275)">
    <rect width="360" height="300" rx="24" class="card" stroke="url(#accent)" stroke-width="3"/>
    <text x="28" y="49" class="head">Segmento orbital</text>
    <text x="28" y="85" class="body muted">Plataforma e subsistemas</text>
    <rect x="28" y="111" width="304" height="70" rx="13" fill="#153a5d" stroke="#37d6c0"/>
    <text x="48" y="141" class="body">Processamento quântico</text><text x="48" y="164" class="small muted">Tecnologia / controle a definir</text>
    <rect x="28" y="198" width="304" height="70" rx="13" fill="#153a5d" stroke="#62a8ff"/>
    <text x="48" y="228" class="body">Armazenamento óptico 5D</text><text x="48" y="251" class="small muted">Hipótese de pesquisa a validar</text>
  </g>
  <g transform="translate(1060 250)">
    <rect width="400" height="275" rx="22" class="card"/>
    <text x="28" y="48" class="head">Ecossistema de I.A.</text>
    <text x="28" y="82" class="small muted">Integração planejada — não conectada</text>
    <rect x="28" y="107" width="344" height="42" rx="10" fill="#173a5b"/><text x="47" y="135" class="body">Oráculo X-37</text>
    <rect x="28" y="160" width="344" height="42" rx="10" fill="#173a5b"/><text x="47" y="188" class="body">Canário-Amarelo</text>
    <rect x="28" y="213" width="344" height="42" rx="10" fill="#173a5b"/><text x="47" y="241" class="body">Aurora DREX</text>
  </g>
  <g transform="translate(300 650)">
    <rect width="1000" height="185" rx="22" class="card"/>
    <text x="32" y="48" class="head">Segmento em solo</text>
    <text x="32" y="82" class="body muted">Planejamento • telemetria • orquestração clássica • observabilidade • políticas de segurança</text>
    <rect x="32" y="111" width="280" height="48" rx="12" fill="#173a5b"/><text x="51" y="142" class="body">Centro de operações</text>
    <rect x="360" y="111" width="280" height="48" rx="12" fill="#173a5b"/><text x="381" y="142" class="body">Serviços autorizados</text>
    <rect x="688" y="111" width="280" height="48" rx="12" fill="#173a5b"/><text x="708" y="142" class="body">Usuários / cargas</text>
  </g>
  <path d="M1017 390 C1040 365 1045 365 1058 365" class="link dashed"/>
  <path d="M810 579 C810 610 810 620 810 647" class="link"/>
  <path d="M1260 527 C1260 580 1150 610 1100 647" class="link dashed"/>
  <text x="80" y="900" class="small muted">Este diagrama ilustra uma decomposição inicial; não é desenho de engenharia nem configuração de voo.</text>
  <text x="80" y="930" class="small muted">Felipe Marcos de Abreu Aquino • CEO &amp; Chief AI Architect • Projeto conceitual</text>
</svg>
